hybrid_transit_viapoint_separation_m: 0.30
hybrid_transit_lookahead_dist_m: 2.00
hybrid_cusp_position_tolerance_m: 0.25
hybrid_cusp_yaw_tolerance_rad: 0.20
hybrid_cusp_max_forward_speed_mps: 0.60
# After a measured cusp stop, at most one 0.30 m Hybrid lattice step may be
# trimmed when a same-gear tangent bridge still respects the 1.35 m radius.
# Otherwise the complete remaining connector is replanned from the live pose.
hybrid_cusp_join_max_skip_m: 0.30
hybrid_cusp_join_chord_tolerance_rad: 0.10
hybrid_transit_min_obstacle_dist_m: 0.20
hybrid_transit_inflation_dist_m: 0.45
hybrid_transit_weight_viapoint: 8.0
hybrid_transit_weight_viapoint_lateral: 100.0
hybrid_transit_weight_viapoint_heading: 50.0
hybrid_transit_include_costmap_obstacles: true
# This edge changes meaning in reverse-only mode: it penalizes forward motion.
# Keep it at least as strong as the base TEB direction constraint so a reverse
# action cannot trade away its fixed gear merely to reduce via-point cost.
hybrid_transit_weight_kinematics_forward_drive: 500.0
hybrid_transit_selection_viapoint_cost_scale: 1.0
hybrid_transit_viapoints_all_candidates: false
hybrid_transit_inner_iterations: 3
hybrid_transit_outer_iterations: 2
# Zero means inherit the active Qt task profile.  Hybrid A* cost estimation and
# TEB execution therefore use the same operator-selected velocity/acceleration
# envelope instead of a hidden transition-only override.
hybrid_transit_max_forward_speed_mps: 0.00
hybrid_transit_max_reverse_speed_mps: 0.00
hybrid_transit_max_angular_speed_rps: 0.00
hybrid_transit_linear_accel_mps2: 0.00
hybrid_transit_angular_accel_rps2: 0.00
