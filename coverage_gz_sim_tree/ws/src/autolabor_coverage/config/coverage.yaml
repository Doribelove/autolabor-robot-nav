# Production architecture: never precompute a mission-wide executable path.
# Every region's first swath is one ordinary Navfn + TEB action.  Only later
# line-to-line transitions are planned from the live pose by direct Hybrid A*.
# The connector is split only at signed-motion cusps; TEB closes the tracking
# loop for each fixed-gear action and a measured zero-speed hand-off precedes
# every direction change.
online_hybrid_without_precompute: false
hierarchical_hybrid_on_demand: true
direct_hybrid_to_final_goal: true
entry_navfn_single_topology: true
hybrid_execute_unsplit_cusps: false
hybrid_rolling_horizon_m: 10.00
hybrid_rolling_plan_timeout_sec: 4.00
hybrid_rolling_max_chunks: 64
minimum_turning_radius_m: 1.35
expected_wheelbase_m: 0.65
expected_max_steering_angle_rad: 0.488692
steering_angle_margin_rad: 0.034907
chassis_wheelbase_tolerance_m: 0.02
footprint_front_m: 0.62
footprint_rear_m: 0.62
footprint_half_width_m: 0.45
candidate_angle_step_deg: 15.0
minimum_swath_length_m: 1.20
path_sample_spacing_m: 0.10
sweep_viapoint_separation_m: 0.30
sweep_weight_viapoint: 50.0
sweep_weight_viapoint_lateral: 200.0
sweep_weight_viapoint_heading: 100.0
sweep_weight_kinematics_forward_drive: 1000.0
sweep_selection_viapoint_cost_scale: 5.0
