# amcl_kobuki_params.yaml

# 1. 坐标系设置
odom_frame_id: "odom"
base_frame_id: "base_link"
global_frame_id: "map"

# 2. 雷达相关（关键：要跟 /scan 对应）
laser_model_type: "likelihood_field"
laser_max_range: 20.0          # 跟 /scan 的 range_max 一致
laser_min_range: 0.1
laser_z_hit: 0.95
laser_z_rand: 0.05
laser_sigma_hit: 0.2
laser_lambda_short: 0.1

# 3. 粒子滤波器相关
min_particles: 500
max_particles: 2000
kld_err: 0.05
kld_z: 0.99
update_min_d: 0.2
update_min_a: 0.2

# 4. 运动模型（kobuki 差速模型）
odom_model_type: "diff"
odom_alpha1: 0.2
odom_alpha2: 0.2
odom_alpha3: 0.2
odom_alpha4: 0.2
odom_alpha5: 0.1

# 5. 初始位置（可选，用于 debug）
initial_pose_x: 0.0
initial_pose_y: 0.0
initial_pose_a: 0.0

