amcl:
  # --- Frame IDs ---
  odom_frame_id: odom              # 里程计坐标系
  base_frame_id: base_footprint    # 机器人底盘坐标系
  global_frame_id: map             # 全局地图坐标系

  # --- Update thresholds ---
  update_min_d: 0.05               # 机器人移动超过0.05m才更新AMCL
  update_min_a: 0.05               # 机器人旋转超过0.05rad才更新AMCL
  resample_interval: 1             # 重采样频率

  # --- Laser model ---
  laser_model_type: likelihood_field
  laser_max_range: 12.0            # 最大激光范围，单位m
  laser_sigma_hit: 0.2             # 激光噪声
  laser_z_hit: 0.7                 # 命中概率
  laser_z_rand: 0.3                # 随机测量概率
  laser_z_max: 0.05                # 最大距离偏差

  # --- Particle filter ---
  kld_err: 0.05                     # KLD-sampling误差
  kld_z: 0.99
  max_particles: 1500
  min_particles: 500

  # --- GUI and publishing ---
  gui_publish_rate: 5.0
  use_map_topic: true
  transform_tolerance: 0.5          # TF容忍时间

  # --- Odometry noise (根据实际机器人调节) ---
  odom_alpha1: 0.2
  odom_alpha2: 0.2
  odom_alpha3: 0.2
  odom_alpha4: 0.2
  odom_alpha5: 0.1

