map_type: costmap
origin_z: 0.0
z_resolution: 1
z_voxels: 2

obstacle_range: 5.0
raytrace_range: 6.0

publish_voxel_map: false
transform_tolerance: 2.0
meter_scoring: true

footprint: [[0.52, 0.35], [0.52, -0.35], [-0.52, -0.35], [-0.52, 0.35]]
# RADIUS: 0.378 from (0.2755**2 + 0.2585**2)**(1/2)
footprint_padding: 0.1

plugins:
  - { name: obstacles_layer, type: "costmap_2d::ObstacleLayer" }
  - { name: inflater_layer, type: "costmap_2d::InflationLayer" }

obstacles_layer:
  observation_sources: scan
  scan:
    sensor_frame: base_link
    data_type: LaserScan
    topic: /scan                 # 关键修改 1：加上根目录斜杠，确保订阅全局话题
    marking: true
    clearing: true
    obstacle_range: 5.0
    raytrace_range: 6.0
    min_obstacle_height: -1.0    # 关键修改 2：放宽下限，防止底盘高度的点被当作“地下”过滤
    max_obstacle_height: 2.0     # 放宽上限
    inf_is_valid: true           # 关键修改 3：因为你的 scan 转换节点开启了 use_inf=true，必须加这个才能正确清除走过的空地
inflater_layer:
  inflation_radius: 1.2
