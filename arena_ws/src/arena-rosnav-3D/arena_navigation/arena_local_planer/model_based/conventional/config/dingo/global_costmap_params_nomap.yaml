global_costmap:
  global_frame: camera_init
  robot_base_frame: base_link
  transform_tolerance: 5.0
  update_frequency: 1.0
  publish_frequency: 1.0
  width: 40.0
  height: 40.0
  resolution: 0.1
  origin_x: -20.0
  origin_y: -20.0
  static_map: false
  rolling_window: true

  plugins:
    - {name: obstacles_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflater_layer, type: "costmap_2d::InflationLayer"}

  # 注意：以下内容必须在 global_costmap 的缩进范围内
  obstacles_layer:
    observation_sources: scan
    scan:
      sensor_frame: base_link
      data_type: LaserScan
      topic: /scan                 # 关键修改 1：加上根目录斜杠，确保订阅全局话题
      marking: true
      clearing: true
      obstacle_range: 5.0
      raytrace_range: 6.0
      min_obstacle_height: -1.0    # 关键修改 2：放宽下限，防止底盘高度的点被当作“地下”过滤
      max_obstacle_height: 3.0     # 放宽上限
      inf_is_valid: true           # 关键修改 3：因为你的 scan 转换节点开启了 use_inf=true，必须加这个才能正确清除走过的空地

  inflater_layer:
    enabled: true
    cost_scaling_factor: 3.0    
    inflation_radius: 1.2
