DWAPlannerROS:
  odom_topic: /odom
  global_frame_id: odom
  holonomic_robot: false
  max_vel_x: 0.8
  min_vel_x: 0.0
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.8
  min_vel_trans: 0.05
  max_vel_theta: 0.65
  min_vel_theta: 0.1
  acc_lim_x: 0.6
  acc_lim_y: 0.0
  acc_lim_theta: 0.6
  xy_goal_tolerance: 0.20
  yaw_goal_tolerance: 0.20
  latch_xy_goal_tolerance: true
  sim_time: 2.0
  sim_granularity: 0.05
  angular_sim_granularity: 0.05
  vx_samples: 12
  vy_samples: 1
  vth_samples: 24
  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.08
  forward_point_distance: 0.4
  stop_time_buffer: 0.3
  scaling_speed: 0.4
  max_scaling_factor: 0.2
  oscillation_reset_dist: 0.2
  prune_plan: true
