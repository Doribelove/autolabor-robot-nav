# V2-04B Gazebo-only startup profile.  All 20 online parameters start at the
# candidate Balanced Anchor so the first transaction has a valid executed origin.
TebLocalPlannerROS:
  max_vel_x: 0.90
  max_vel_theta: 0.75
  acc_lim_x: 0.60
  acc_lim_theta: 0.60
  min_obstacle_dist: 0.375
  inflation_dist: 0.725
  weight_obstacle: 75.0
  weight_viapoint: 2.50
  weight_optimaltime: 0.75
  dynamic_obstacle_inflation_dist: 0.75
  weight_dynamic_obstacle: 60.0
  weight_dynamic_obstacle_inflation: 0.30
  weight_velocity_obstacle_ratio: 5.0
  max_vel_x_backwards: 0.30
  max_global_plan_lookahead_dist: 6.0
  global_plan_viapoint_sep: 0.35
  include_dynamic_obstacles: true
  max_number_classes: 2
  selection_cost_hysteresis: 0.95
  switching_blocking_period: 0.50
