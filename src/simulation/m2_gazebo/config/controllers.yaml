m2_gazebo:
  control_mode: kinematic_bicycle
  cmd_vel_topic: /cmd_vel
  ackerman_vel_topic: /ackerman_vel
  odom_topic: /odom
  odom_frame: odom
  base_frame: base_link
  publish_tf: true
  update_rate_hz: 50.0
  command_timeout_s: 0.5
  cmd_angle_instead_rotvel: false
  notes:
    - The first T02 controller is deterministic kinematic Ackermann, not a calibrated tire or suspension model.
    - Brake, emergency-stop, reset-odom, wheel telemetry, and chassis-parameter query mirror the real driver namespace.
