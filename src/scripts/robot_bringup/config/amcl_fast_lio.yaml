# FAST-LIO supplies the locally smooth camera_init -> body -> base_link chain.
# AMCL estimates only the global correction map -> camera_init from /scan.
odom_frame_id: camera_init
base_frame_id: base_link
global_frame_id: map
tf_broadcast: true
transform_tolerance: 0.5

odom_model_type: diff-corrected
odom_alpha1: 0.02
odom_alpha2: 0.02
odom_alpha3: 0.02
odom_alpha4: 0.02
odom_alpha5: 0.01

min_particles: 500
max_particles: 3000
kld_err: 0.02
kld_z: 0.99
update_min_d: 0.10
update_min_a: 0.08
resample_interval: 1
recovery_alpha_slow: 0.001
recovery_alpha_fast: 0.10

laser_model_type: likelihood_field_prob
laser_max_beams: 120
laser_min_range: 0.5
laser_max_range: 12.0
laser_z_hit: 0.90
laser_z_rand: 0.05
laser_z_short: 0.05
laser_z_max: 0.0
laser_sigma_hit: 0.20
laser_lambda_short: 0.10
laser_likelihood_max_dist: 2.0
do_beamskip: true
beam_skip_distance: 0.5
beam_skip_threshold: 0.3
beam_skip_error_threshold: 0.9

# The generated map uses the original FAST-LIO camera_init coordinates. These
# defaults are correct only when navigation restarts at the mapping start pose;
# otherwise set /initialpose (RViz "2D Pose Estimate") before commanding motion.
initial_pose_x: 0.0
initial_pose_y: 0.0
initial_pose_a: 0.0
initial_cov_xx: 0.25
initial_cov_yy: 0.25
initial_cov_aa: 0.2741556778

gui_publish_rate: 2.0
save_pose_rate: 0.5
