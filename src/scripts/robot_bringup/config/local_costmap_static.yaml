local_costmap:
  # The localizer and FAST-LIO publish map -> camera_init -> body.
  global_frame: map
  robot_base_frame: base_link
  transform_tolerance: 1.0
  update_frequency: 10.0
  publish_frequency: 2.0
  static_map: false
  rolling_window: true
  width: 20.0
  height: 20.0
  resolution: 0.10

  plugins:
    # Keep immutable 2-D walls in the rolling local window. Without this
    # layer TEB only sees live /scan obstacles and may optimize through a wall
    # that is present exclusively in the known map. Occupied cells baked into
    # /map are intentionally authoritative; scan ray clearing cannot decide
    # whether one is a removed temporary object or a real wall.
    - {name: static_layer, type: "costmap_2d::StaticLayer"}
    - {name: obstacles_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflater_layer, type: "costmap_2d::InflationLayer"}
    # Run last: LaserScan ray clearing must never convert static-map unknown
    # or coordinates outside the source map into traversable local cells.
    - {name: unknown_space_guard_layer, type: "robot_bringup/UnknownSpaceGuardLayer"}

  static_layer:
    enabled: true
    map_topic: /map
    first_map_only: false
    subscribe_to_updates: true
    track_unknown_space: true
    use_maximum: false
    trinary_costmap: true
    lethal_cost_threshold: 65
    unknown_cost_value: -1

  obstacles_layer:
    observation_sources: scan
    scan:
      sensor_frame: base_link
      data_type: LaserScan
      topic: /scan
      expected_update_rate: 0.3
      marking: true
      clearing: true
      obstacle_range: 10.0
      raytrace_range: 11.0
      # /scan is already filtered to 0.25-0.80 m before planar projection.
      # Include its map-frame plane when static localization has a vertical offset.
      min_obstacle_height: -2.0
      max_obstacle_height: 3.0
      inf_is_valid: true

  inflater_layer:
    enabled: true
    cost_scaling_factor: 10.0
    inflation_radius: 1.2

  unknown_space_guard_layer:
    enabled: true
    map_topic: /map
