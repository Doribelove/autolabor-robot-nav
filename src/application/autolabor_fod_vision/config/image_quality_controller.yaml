# The node itself is only started when the dedicated launch argument is true.
enabled: true
monitor_only: false

image_topic: /fod_camera/image_raw
dynamic_reconfigure_server: /zed2/zed_node
control_rate_hz: 2.0
image_timeout_sec: 1.0
settle_cycles: 2
max_sample_width: 320

# Ignore the upper image area, which is commonly sky/window/background. Tune
# these fractions after the camera is mounted so that this ROI covers the road.
roi_x_min: 0.05
roi_x_max: 0.95
roi_y_min: 0.25
roi_y_max: 1.0

target_median: 115.0
median_tolerance: 8.0
dark_threshold: 5
bright_threshold: 250
max_dark_fraction: 0.08
max_bright_fraction: 0.02

# If both tails clip, exposure alone cannot solve the scene. The controller
# holds its setting (or leaves native auto active) and reports a warning.
dynamic_range_dark_fraction: 0.08
dynamic_range_bright_fraction: 0.02
sharpness_warn_threshold: 45.0
color_mean_spread_warn: 45.0

controller_gain: 0.60
max_exposure_step_ratio: 1.35

# ZED exposes manual exposure and gain as integer percentages (0..100), not
# microseconds/dB. Avoid zero exposure so the multiplicative controller can
# recover from a dark setting. Gain rises only after exposure reaches its cap.
exposure_min_percent: 1.0
exposure_max_percent: 100.0
gain_min: 0.0
gain_max: 100.0
gain_step: 2.0

restore_auto_on_shutdown: true
