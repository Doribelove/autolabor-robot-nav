  observation_features: frozen
  progress_reward_per_m: 1.0
  speed_change_reward_per_mps: -0.015
  action_switch_reward: -0.01
  goal_reward: 6.0
  timeout_reward: -2.0
  ppo_algorithm_and_hyperparameters: frozen
  primary_metric_and_all_gates: frozen
  simulation_only_claim_boundary: frozen
training:
  seeds: [4103, 4104]
