  checkpoint_validation_seed_range_inclusive: [422200, 422399]
  selection: highest_mean_validation_return_subject_to_task_and_safety_gates
  both_seed_directions_must_be_positive: true
  cross_seed_mean_time_reduction_minimum: 0.03
