    mask produce a deterministic counterfactual rank target over the same
    Ackermann candidates. One auxiliary cross-entropy epoch follows every PPO
    update. The sensor actor never receives the privileged fields, target or
    family ID at inference.
  eligible_families: [partially_occluded_crossing, narrow_corridor_yield]
  eligible_until_ego_x_m: 4.0
  rank_order:
    - high_speed_spatial_candidate_opposite_privileged_hazard_side
    - low_speed_spatial_candidate_opposite_privileged_hazard_side
    - fastest_hard_mask_accepted_straight_candidate
