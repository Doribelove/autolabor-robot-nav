# Topics and expected production graph.  This controller is intentionally tied
# to the real Hikrobot + M2 chain; simulation must use a separate configuration.
detections_topic: /fod/detections
camera_info_topic: /fod_camera/camera_info
odom_topic: /odom
cmd_vel_topic: /cmd_vel
ackermann_topic: /ackerman_vel
wheel_angle_topic: /m2_driver/wheel_angle
chassis_status_topic: /m2_driver/chassis_info
control_timeout_topic: /m2_driver/control_timeout
canbus_topic: /canbus_msg
canbus_service: /canbus_server
chassis_parameter_service: /m2_driver/chassis_parameter

# These M2 inputs bypass /cmd_vel.  The default mode requires all four to have
# no publishers.  External-estop override exempts only emergency_stop; the
# geometry/progress-altering steer/reset/brake inputs remain forbidden in every
# mode.  Finish one-shot calibration and wait for `rostopic pub -1` to exit
# before enabling this controller.
steer_center_bias_topic: /m2_driver/steer_center_bias
reset_odom_topic: /m2_driver/reset_odom
brake_set_topic: /m2_driver/brake_set
emergency_stop_topic: /m2_driver/emergency_stop

expected_detector_node: /fod_detector
expected_camera_node: /fod_camera/driver
expected_driver_node: /m2_driver
# Standalone mode sends directly to the driver. The integrated GPS/FOD launch
# overrides this with /fod_navigation_mode while keeping /m2_driver as the
# odometry, wheel, chassis-status, and parameter-service authority.
expected_cmd_vel_subscriber_node: /m2_driver
expected_canbus_node: /canbus_driver
expected_image_width: 1280
expected_image_height: 1024
expected_camera_frame: fod_camera_optical_frame
expected_odom_frame: odom
expected_base_frame: base_link
expected_model_sha256: 7bf99d4c61343e8cdb37289f2eece6cf18342b508f9b7f80723592edce398500

# The production model has material/tool classes, not a class literally named
# "fod".  A higher threshold than the detector's display threshold is used for
# motion decisions.
allowed_class_names: [Metal, Soft, Plastic, Wire, Tool, w]
# The live approved model publishes the current small Metal target steadily at
# roughly 0.38..0.43 confidence.  Require six stable frames for acquisition,
# but do not discard those valid detections with a mismatched 0.45 gate.
min_confidence: 0.30

# Explicit hardware authorization is supplied by the launch argument and is
# false by default.  A SetBool(true) service call is still required afterwards.
allow_motion: false
# Opt-in only: delegate raw CAN, aggregated chassis emergency, VCU timeout, CAN
# graph/service, and ROS emergency-stop-topic safety gates to an attended remote
# stop operator.  Visual, odom, wheel, controller-ownership, distance,
# and absolute-time checks remain active.
external_estop_override: false
precheck_timeout_sec: 15.0
mode_timeout_sec: 75.0
publish_rate_hz: 20.0
control_rate_hz: 20.0
status_rate_hz: 2.0
# Control updates do not expire the last command. Explicit stop and the
# overall task deadline still clear it.
stop_publish_sec: 1.0

# Sensor and graph watchdogs.
# Detection receipt/source age does not stop recovery. CameraInfo and chassis
# feedback retain their separate checks below.
camera_info_timeout_sec: 0.60
odom_timeout_sec: 0.60
source_stamp_timeout_sec: 0.80
detection_odom_sync_tolerance_sec: 0.20
wheel_angle_timeout_sec: 0.60
chassis_status_timeout_sec: 3.0
# Query one safety item every 0.20 s in round-robin order.  Sending all four
# back-to-back makes this VCU intermittently drop replies.  A 2.50 s freshness
# window covers more than two complete 0.80 s rounds without weakening the
# immediate unsafe-value latch.
raw_can_timeout_sec: 2.50
raw_can_query_interval_sec: 0.20
graph_check_interval_sec: 0.50

# Target lock. target_u is CameraInfo.cx plus this offset.
# Positive offset moves the desired pickup line to the right in the image.
use_camera_principal_point: true
target_u_offset_px: 0.0
min_acquire_anchor_v_fraction: 0.20
max_acquire_anchor_v_fraction: 1.0
# Accept targets across the central 65% of the image width. Keep a small
# margin inside the runtime gate so pixel jitter cannot acquire and then
# immediately abort at the edge.
acquire_max_abs_horizontal_error: 0.65
acquire_frames: 6
association_min_iou: 0.05
association_max_anchor_distance_ratio: 0.18
association_min_area_ratio: 0.35
association_max_area_ratio: 2.80
pixel_filter_alpha: 0.35

# Recovery area: middle/lower half of the visible ground band, central 60% width.
# Entry is latched for the selected target. Its first subsequent loss commits
# one 0.80 m odometry-only crossing, even if boxes/camera frames later disappear.
recovery_region_top_fraction: 0.50
recovery_region_width_fraction: 0.60
tracking_loss_grace_sec: 0.30

# Ackermann-compatible pixel controller.  With the current forward camera,
# image-right requires ROS negative yaw, hence steering_sign=-1.
steering_sign: -1.0
curvature_gain: 0.65
horizontal_deadband: 0.025
max_steering_angle_deg: 12.0
max_runtime_horizontal_error: 0.70
far_speed_mps: 0.60
near_speed_mps: 0.60
slow_start_fraction: 0.65
near_start_fraction: 0.82
lateral_slowdown_error: 0.45
minimum_lateral_speed_scale: 0.35
# Two live M2 runs showed that both a 0.0525 m/s shaped command and the later
# 0.12 m/s minimum can turn the front wheel without starting sustained chassis
# motion (the 0.12 m/s run accumulated only 0.0106 m in three seconds).  Use
# the 0.20 m/s command already proven to start this chassis during straight-line
# calibration. Distance, steering and absolute-time limits remain active.
approach_min_command_speed_mps: 0.20
# At 20 Hz the first increment reaches the established 0.20 m/s starting
# command; subsequent increments reach the requested 0.60 m/s in three ticks.
max_linear_acceleration_mps2: 4.00
max_curvature_rate_per_sec: 0.80
max_approach_distance_m: 6.0
approach_no_motion_timeout_sec: 3.0
approach_no_progress_timeout_sec: 2.0
approach_progress_step_m: 0.02
max_measured_speed_mps: 0.80
max_pose_step_m: 0.10

# Continue from first disappearance after recovery-area entry. Stop command
# at 0.80 m from its source pose; camera feedback is no longer required.
# No intermediate stop/steering-settle or 0.15 m displacement cutoff.
# Final stop uses stationary odometry and pose drift; wheel centering is not
# required for a stationary vehicle to complete its recovery.
blind_speed_mps: 0.60
blind_distance_m: 0.80
blind_hard_distance_m: 0.90
blind_timeout_sec: 12.0
blind_no_motion_timeout_sec: 2.0
blind_no_progress_timeout_sec: 1.50
blind_progress_step_m: 0.01
# Heading change and lateral displacement are reported, without abort limits.
final_stop_confirm_sec: 0.50
final_stop_speed_mps: 0.01
final_stop_max_drift_m: 0.005
final_stop_timeout_sec: 3.0
