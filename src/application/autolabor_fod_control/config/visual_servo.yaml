# Topics and expected production graph. This controller is intentionally tied
# to the real ZED 2 + M2 chain; simulation must use a separate configuration.
detections_topic: /fod/detections
metric_results_topic: /fod/vision/results
camera_info_topic: /fod_camera/camera_info
odom_topic: /odom
cmd_vel_topic: /cmd_vel
ackermann_topic: /ackerman_vel
wheel_angle_topic: /m2_driver/wheel_angle
chassis_status_topic: /m2_driver/chassis_info
control_timeout_topic: /m2_driver/control_timeout
canbus_topic: /canbus_msg
chassis_parameter_service: /m2_driver/chassis_parameter

# These M2 inputs bypass /cmd_vel.  The default mode requires all four to have
# no publishers.  External-estop override exempts only emergency_stop; the
# geometry/progress-altering steer/reset/brake inputs remain forbidden in every
# mode.  Finish one-shot calibration and wait for `rostopic pub -1` to exit
# before enabling this controller.
steer_center_bias_topic: /m2_driver/steer_center_bias
reset_odom_topic: /m2_driver/reset_odom
brake_set_topic: /m2_driver/brake_set
emergency_stop_topic: /m2_driver/emergency_stop

expected_detector_node: /fod_detector
expected_camera_node: /zed2/zed_node
expected_driver_node: /m2_driver
# Standalone mode sends directly to the driver. The integrated GPS/FOD launch
# overrides this with /fod_navigation_mode while keeping /m2_driver as the
# odometry, wheel, chassis-status, and parameter-service authority.
expected_cmd_vel_subscriber_node: /m2_driver
expected_canbus_node: /canbus_driver
# ZED 2 grabs HD720 and the project launch publishes with downscale factor 2.
expected_image_width: 640
expected_image_height: 360
expected_camera_frame: zed2_left_camera_optical_frame
expected_odom_frame: odom
expected_base_frame: base_link
expected_model_sha256: 7bf99d4c61343e8cdb37289f2eece6cf18342b508f9b7f80723592edce398500
expected_metric_backend: detect_and_classify
expected_metric_frame: map

# The production model has material/tool classes, not a class literally named
# "fod".  A higher threshold than the detector's display threshold is used for
# motion decisions.
allowed_class_names: [Metal, Soft, Plastic, Wire, Tool, w]
# The live approved model publishes the current small Metal target steadily at
# roughly 0.38..0.43 confidence.  Require six stable frames for acquisition,
# but do not discard those valid detections with a mismatched 0.45 gate.
min_confidence: 0.30

# ZED registered-depth gates. Every motion candidate must carry a synchronized,
# robust depth estimate. Among multiple eligible FODs, the closest depth is
# selected; a small acquisition-only hysteresis prevents pixel/depth noise from
# resetting the six-frame lock. After lock, spatial association keeps following
# that same object instead of jumping to a different FOD.
require_depth_for_acquisition: true
min_target_depth_m: 0.35
# GPS remains in control until the mode manager sees the nearest FOD at or
# within 8 m. Keep visual acquisition on the same range so a farther object
# cannot replace the target while the vehicle is stopping for handoff.
max_target_depth_m: 8.0
min_depth_sample_count: 20
min_depth_valid_fraction: 0.20
max_depth_mad_m: 0.35
max_depth_sync_delta_sec: 0.08
nearest_depth_hysteresis_m: 0.10
# A locked target may briefly lose motion-grade registered depth because of
# normal stereo/depth jitter. Keep tracking it from its image geometry for four
# consecutive rejected frames, and stop on the fifth. Any valid-depth frame or
# a frame that does not spatially match the locked target resets this counter.
locked_depth_invalid_abort_frames: 5

# Explicit hardware authorization is supplied by the launch argument and is
# false by default.  A SetBool(true) service call is still required afterwards.
allow_motion: false
# Opt-in only: delegate raw CAN observation, aggregated chassis emergency, VCU
# timeout, CAN-publisher graph, and ROS emergency-stop-topic safety gates to an
# attended remote stop operator.  Visual, odom, wheel, controller-ownership,
# lease, distance, and absolute-time checks remain active.
external_estop_override: false
precheck_timeout_sec: 15.0
mode_timeout_sec: 75.0
publish_rate_hz: 20.0
control_rate_hz: 20.0
status_rate_hz: 2.0
command_lease_sec: 0.25
stop_publish_sec: 1.0

# Sensor and graph watchdogs.
detection_timeout_sec: 0.50
metric_results_timeout_sec: 0.60
# Pixel and metric results share the exact camera source stamp. The tiny
# tolerance only absorbs serialization precision; it does not pair nearby
# frames. Boxes must also form a unique high-overlap identity match.
metric_sync_tolerance_sec: 0.002
metric_bbox_min_iou: 0.90
metric_max_position_jump_m: 0.10
metric_max_selected_position_delta_m: 0.25
map_tf_timeout_sec: 0.60
staged_target_timeout_sec: 30.0
camera_info_timeout_sec: 0.60
odom_timeout_sec: 0.60
source_stamp_timeout_sec: 0.50
detection_odom_sync_tolerance_sec: 0.20
wheel_angle_timeout_sec: 0.60
chassis_status_timeout_sec: 3.0
# The NVIDIA M2 driver is the only periodic VCU query owner.  It uses a 3 Hz
# mean attempt rate with bounded phase jitter and up to four attempts for a
# missing safety reply.  A complete all-miss fairness cycle is bounded below
# this 8 s freshness window.  This controller only observes /canbus_msg;
# explicit unsafe replies are still latched immediately.
raw_can_timeout_sec: 8.00
graph_check_interval_sec: 0.50

# Target lock and blind-zone gate.  target_u is CameraInfo.cx plus this offset.
# Positive offset moves the desired pickup line to the right in the image.
use_camera_principal_point: true
target_u_offset_px: 0.0
min_acquire_anchor_v_fraction: 0.03
max_acquire_anchor_v_fraction: 0.97
# Accept targets across the central 65% of the image width. Keep a small
# margin inside the runtime gate so pixel jitter cannot acquire and then
# immediately abort at the edge.
acquire_max_abs_horizontal_error: 0.65
acquire_frames: 6
association_min_iou: 0.05
association_max_anchor_distance_ratio: 0.18
# No box-area ratio gate: perspective and bottom-edge clipping change size.
# Spatial matching and rejection of ambiguous multiple targets remain active.
# Class-aware YOLO NMS can occasionally emit the same physical object twice
# with different class names. Collapse only a pairwise high-overlap group
# whose anchors and registered depths also agree. Nearby or depth-separated
# objects remain ambiguous and stop the controller.
duplicate_detection_min_iou: 0.80
duplicate_detection_max_anchor_distance_ratio: 0.02
duplicate_detection_max_depth_delta_m: 0.15
pixel_filter_alpha: 0.35

# Completion: ten consecutive fresh frames without the locked target,
# then measure an additional 0.50 m forward from current odometry.
# No bottom/center/area/minimum-approach/time gate. Reappearance resets count.
loss_confirm_frames: 10

# Ackermann-compatible pixel controller.  With the current forward camera,
# image-right requires ROS negative yaw, hence steering_sign=-1.
steering_sign: -1.0
curvature_gain: 0.65
horizontal_deadband: 0.025
max_steering_angle_deg: 12.0
far_speed_mps: 0.20
near_speed_mps: 0.20
slow_start_fraction: 0.65
near_start_fraction: 0.82
lateral_slowdown_error: 0.45
minimum_lateral_speed_scale: 0.35
# Two live M2 runs showed that both a 0.0525 m/s shaped command and the later
# 0.12 m/s minimum can turn the front wheel without starting sustained chassis
# motion (the 0.12 m/s run accumulated only 0.0106 m in three seconds).  Use
# the 0.20 m/s command already proven to start this chassis during straight-line
# calibration.  Distance, steering, lease and absolute-time limits remain active.
approach_min_command_speed_mps: 0.20
# At the 20 Hz control rate this reaches the low 0.20 m/s hard speed limit in
# one tick. A slow ramp is ineffective on the physical chassis because every
# intermediate command remains below its measured start deadband.
max_linear_acceleration_mps2: 4.00
max_curvature_rate_per_sec: 0.80
approach_no_motion_timeout_sec: 3.0
approach_no_progress_timeout_sec: 2.0
approach_progress_step_m: 0.02
max_measured_speed_mps: 0.30
max_pose_step_m: 0.05

# The cleaning apparatus reference is in front of base_link. A selected map
# coordinate is frozen into wheel odometry at visual lock, then tested against
# every front-reference line segment. Only geometrically forward segments with
# positive measured velocity count. The tolerance is hard-capped in code at
# 0.10 m; reverse traversal and zero-speed pose jitter never mark completion.
# 2026-11-01 brush at front of the 0.70 m attachment (0.52 + 0.70 m).
cleaning_reference_offset_m: 1.22
cleaning_coverage_tolerance_m: 0.10
cleaning_min_forward_step_m: 0.001
cleaning_min_forward_speed_mps: 0.02

# Once loss is confirmed, immediately command a straight forward pass.
# These three feedback counters are retained for source compatibility only;
# wheel centering and final-stop velocity are NOT cleaning completion gates.
settle_wheel_angle_deg: 2.0
settle_speed_mps: 0.03
final_stop_speed_mps: 0.01
blind_speed_mps: 0.20
blind_distance_m: 0.50
blind_hard_distance_m: 0.55
blind_timeout_sec: 12.0
blind_no_motion_timeout_sec: 2.0
blind_no_progress_timeout_sec: 1.50
blind_progress_step_m: 0.01
