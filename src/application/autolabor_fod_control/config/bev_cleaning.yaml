# T_base_link_from_BEV: [x metres, y metres, yaw radians].
# BEV origin = ground below the midpoint of the side cameras.
# 2026-11-01 user confirmed that side-camera midpoint, MID360 and original
# chassis centre share X/Y. Keep X forward/Y left and the original base origin.
# The added front cleaner changes the footprint, not this coordinate origin.
# An existing source-stamped map <- camera_rig_ground_estimate TF can also be used.
# Camera heights (0.80m sides/rear, 0.32m front) are in the BEV rig config.
# This separate planar transform cannot be inferred from those heights alone.
rig_to_base_xyyaw: [0.0, 0.0, 0.0]
map_frame: map
base_frame: base_link
detections_url: http://127.0.0.1:18884/detections
# User confirmed brush at attachment front: M2 half-length 0.52 + 0.70 m.
cleaning_reference_offset_m: 1.22
cleaning_tolerance_m: 0.10
