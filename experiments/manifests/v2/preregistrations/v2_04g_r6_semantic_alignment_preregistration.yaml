research_question: >-
  With all R5/D1 evidence frozen and no new execution, is a single atomic
  runtime conflict-estimator selector well specified and offline-identifiable
  when its repair level reuses the evaluator's circle-envelope first-contact
  primitive, and are all six D1 execution-integrity repairs implemented as
  candidate-symmetric fail-closed protocols that can gate a later review?

