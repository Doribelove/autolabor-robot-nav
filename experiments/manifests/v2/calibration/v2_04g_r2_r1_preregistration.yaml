  warmup_timeout_s: 12.0
  measurement_duration_s: 6.0
  minimum_message_count: 20
  minimum_valid_fraction: 0.95
  required_consecutive_stable_count: 10
  maximum_expected_context_hold_count: 1
  maximum_backend_transaction_fault_count: 0
  maximum_unknown_transaction_fault_count: 0
  schedule:
    - {sequence: 1, profile_id: r2_target_balanced, repeat: 1, seed: 4981}
    - {sequence: 2, profile_id: r2_target_balanced, repeat: 2, seed: 4982}
    - {sequence: 3, profile_id: r2_target_balanced, repeat: 3, seed: 4983}
    - {sequence: 4, profile_id: r2_target_aggressive, repeat: 1, seed: 4984}
    - {sequence: 5, profile_id: r2_target_aggressive, repeat: 2, seed: 4985}
