research_question: >-
  With the R1 bounded join, R2 mechanism candidates, and R2 typed transaction
  runtime frozen, does recording the complete transaction fault_reason domain,
  separating expected fail-closed context holds from backend/unknown faults,
  and requiring a consecutive stable readiness window yield 6/6 deterministic
  readiness passes on entirely new seeds?

single_changed_factor:
  name: readiness_fault_taxonomy_and_stable_measurement_barrier
  previous_behavior:
    - measurement began after one joined activated message
    - every nonempty fault_reason was counted as the same transaction fault
    - the full reason and state context were not retained
  new_behavior:
    - require 10 consecutive stable mechanism messages before measurement
    - preserve complete fault_reason counts and a state snapshot per fault
    - classify expected context hold, backend fault, and unknown fault separately
  join_changed: false
  runtime_candidate_numbers_changed: false
  typed_transaction_runtime_changed: false

