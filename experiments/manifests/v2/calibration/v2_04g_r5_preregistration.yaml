research_question: >-
  With the demonstrated V2-04G-R4-R1 Maneuver min_obstacle_dist=0.30 m
  repair retained only as a fixed non-ranking input, and every other passed
  Anchor, supervisor, typed-transaction, join, reverse, switching, clearance
  and time mechanism frozen, can changing only the Dynamic-conflict runtime
  prediction horizon improve TTC activation and coverage robustness on fresh
  calibration-only evidence without violating any preregistered safety,
  completeness or efficiency hard gate?

