execution_order:
  - validate frozen resources, single-factor diff, exact schedules and seed firewall offline
  - six scene-based TTC activation-and-coverage readiness episodes on probe-only seeds 5111 through 5113
  - three deterministic TTC component evidence identities
  - fifteen Fixed TEB episodes on navigation seeds 5121 through 5135
  - fifteen non-winner control-horizon episodes on the same navigation seeds
  - fifteen 4.5-second candidate episodes on the same navigation seeds
  - fifteen 4.0-second candidate episodes on the same navigation seeds
  - fail-closed hard-gate assessment
  - stop and wait for a separate winner-freeze instruction

stopping_rules:
  readiness_failure: stop_before_component_ttc_and_navigation_and_preserve
  ttc_component_failure: stop_before_navigation_and_preserve
  any_terminal_evidence_failure: stop_immediately_preserve_identity_and_forbid_resume
  failed_identity_retry: forbidden
  fixed_reference_collision_or_fewer_than_14_successes: invalidate_split
  candidate_collision_incomplete_evidence_or_any_hard_gate_failure: disqualify_candidate
  no_candidate_passes_all_hard_gates: stop_without_winner_held_out_or_v2_05
  early_performance_selection: forbidden
  seed_replacement: forbidden
  post_hoc_scene_relabel_or_threshold_change: forbidden
  failure_episode_deletion: forbidden
  adverse_seed_deletion: forbidden
  budget_expansion: forbidden

