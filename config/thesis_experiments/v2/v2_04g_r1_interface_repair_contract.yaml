schema_version: "2.0"
architecture_generation: v2
stage: V2-04G-R1
contract_id: fam_teb_v2_04g_r1_calibration_only_bounded_join_1
status: preregistered_before_runtime_probe
simulation_only: true
formal_result: false
runtime_ready: false
training_allowed: false
real_vehicle_use_forbidden: true

scope:
  split: calibration
  single_changed_factor: asynchronous_geometry_context_join
  candidate_count: 3
  scene_count: 15
  scene_count_per_family: 3
  activation_readiness_probe_count: 6
  fixed_reference_episode_count: 15
  candidate_navigation_episode_count: 45
  planned_navigation_episode_count: 60
  tracker_invalid_component_probe_count: 3
  total_evidence_unit_budget: 69
  validation_seed_reuse_forbidden: true
  previous_v2_04g_evidence_reuse_for_ranking: false

single_factor_invariance:
  unchanged_from_v2_04g:
    - candidate supervisor numeric patches
    - candidate Anchor numeric patches
    - candidate mechanism numeric values
    - scene geometry and dynamic-agent timing templates
    - navigation budget and execution order
    - safety, TTC, chatter, activation and efficiency hard gates
  changed:
    - stage identifiers and fresh calibration seeds
    - exact-sequence asynchronous join replaced by bounded cache join
    - deterministic activation readiness gate inserted before navigation
    - navigation-time join evidence recorded and assessed

bounded_context_join:
  geometry_cache_maximum_entries: 32
  geometry_cache_maximum_arrival_age_s: 1.0
  maximum_sequence_delta: 2
  maximum_timestamp_delta_s: 0.45
  future_sequence_allowed: false
  future_source_timestamp_allowed: false
  preference_order:
    - smallest nonnegative sequence delta
    - smallest nonnegative source timestamp delta
    - newest sequence
  accepted_reasons: [EXACT_SEQUENCE_JOIN, BOUNDED_SEQUENCE_TIME_JOIN]
  no_bounded_match_behavior: invalidate_context_and_hold_fail_closed
  simulation_clock_rollback_behavior: clear_cache

activation_readiness_probe:
  required_before_navigation: true
  profiles: [g1_mechanism_balanced, g2_mechanism_aggressive]
  repeats_per_profile: 3
  planned_probe_count: 6
  warmup_timeout_s: 8.0
  measurement_duration_s: 6.0
  minimum_message_count_per_stream: 20
  minimum_transaction_activated_fraction: 0.95
  minimum_transaction_valid_fraction: 0.95
  minimum_join_valid_fraction: 0.95
  transaction_fault_count_max: 0
  all_repeats_required: true
  navigation_on_failure: forbidden

ttc_semantics:
  statuses: [OBSERVED_CONFLICT, NO_CONFLICT_IN_HORIZON, TRACKER_INVALID]
  OBSERVED_CONFLICT: healthy tracker and at least one finite relative-motion collision-envelope TTC sample
  NO_CONFLICT_IN_HORIZON: healthy tracker with no finite TTC inside the frozen horizon
  TRACKER_INVALID: no tracker message or no healthy tracker sample
  dynamic_scene_design:
    expected_observed_conflict_scene_count_per_method: 2
    expected_no_conflict_scene_count_per_method: 1
    navigation_tracker_invalid_count_max_per_method: 0
  component_fault_probe:
    required_statuses: [OBSERVED_CONFLICT, NO_CONFLICT_IN_HORIZON, TRACKER_INVALID]
    all_three_states_required: true

clearance_audit:
  legacy_metric: nonnegative LaserScan endpoint-to-rectangular-footprint clearance
  added_evidence:
    - signed_scan_footprint_clearance
    - minimum_raw_range_and_ray_angle
    - evaluator_only_gazebo_oriented_box_clearance
    - gazebo_contact_count
  runtime_policy_truth_access: false

hard_gates:
  evidence:
    activation_probe_pass: true
    complete_navigation_episode_count: 60
    persistent_interface_failure_count_max: 0
    training_used: false
    runtime_manifest_or_scene_label_access: false
  bounded_context_join:
    minimum_valid_fraction_per_episode: 0.90
    allowed_join_reasons: [EXACT_SEQUENCE_JOIN, BOUNDED_SEQUENCE_TIME_JOIN]
  fixed_reference_validity:
    success_count_min: 14
    collision_count_max: 0
  candidate_safety:
    success_count_not_below_fixed: true
    collision_count_max: 0
    minimum_clearance_m_min_per_successful_episode: 0.25
    typed_transaction_invalid_count_max: 0
  ttc:
    observed_conflict_count_min_per_method: 2
    no_conflict_count_min_per_method: 1
    tracker_invalid_navigation_count_max_per_method: 0
    component_three_state_probe_pass: true
  chatter:
    active_anchor_switch_count_max_per_episode: 3
    active_anchor_switch_count_mean_max: 2.0
  mechanism_activation_for_non_control_candidates:
    topology_locked_sample_count_min: 1
    corridor_centerline_sample_count_min: 1
    maneuver_reverse_sample_count_min: 1
    mechanism_topology_switch_count_max_per_episode: 1
  efficiency_vs_fixed:
    total_navigation_time_ratio_max: 1.05
    family_median_navigation_time_regression_percent_max: 15.0
    family_non_regression_count_min: 3
    required_family_set: [CRUISE, DYNAMIC, STATIC_DENSE, CORRIDOR, MANEUVER]

ranking_after_hard_gates:
  - highest_family_navigation_time_improvement_count
  - lowest_total_navigation_time_ratio_vs_fixed
  - highest_minimum_clearance_m
  - lowest_total_active_anchor_switch_count
  - lexical_candidate_id

stopping_rules:
  - any activation readiness repeat failure stops before navigation
  - persistent navigation interface failure after two attempts stops and preserves evidence
  - fixed reference collision or fewer than 14 successes invalidates the split
  - candidate collision or incomplete evidence disqualifies the candidate
  - no candidate passing every hard gate means no freeze and no held-out validation
  - no early performance winner selection and no budget expansion

post_calibration_gate:
  freeze_only_if_all_hard_gates_pass: true
  held_out_validation_generated_only_after_freeze: true
  held_out_seed_range_reserved: [5001, 5010]
  held_out_methods: [fixed_teb, balanced_anchor, rule_multi_anchor]
  held_out_planned_episode_count: 30
  v2_05_authorized: false
  sac_training_authorized: false
  real_vehicle_authorized: false
