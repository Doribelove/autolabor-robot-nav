single_executable_factor:
  factor_id: p2_cruise_forward_velocity_ceiling_v1
  behavioral_field_count: 1
  ros_runtime_field: TebLocalPlannerROS.max_vel_x
  typed_registry_field: max_vel_x
  fam_teb_mapping: anchors.anchor_cruise.values.max_vel_x
  current_control_value_mps: 1.20
  proposed_design_upper_bound_mps: 1.40
  calibration_grid_mps: [1.20, 1.25, 1.30, 1.35, 1.40]
  treatment_candidate_grid_mps: [1.25, 1.30, 1.35, 1.40]
  maximum_rate_per_s_frozen: 0.50
  acceleration_limit_mps2_frozen: 0.80
  runtime_scene_label_or_expected_status_access: false
  applies_when_frozen_decoder_selects_anchor_cruise: true
  existing_dynamic_overlay_scaling_remains_active: true
  overlay_bypass_or_safety_gate_disable_allowed: false
  metadata_changes_not_counted_as_behavior:
    - versioned max_vel_x registry upper-bound declaration from 1.20 to 1.40
  all_other_behavioral_fields_byte_frozen_at_materialization: true

factor_selection:
  qualification_order_mps: [1.25, 1.30, 1.35, 1.40]
  selection_data: calibration_only
  circle_contact_candidate:
    eligibility:
      - complete paired calibration matrix
      - zero collision
      - zero emergency_or_interface_failure
      - zero unexplained crash_or_integrity_failure
      - no role has fewer successes than circle_contact_v120
      - no role has clearance point difference below -0.05_m
      - normal_projection_rate_strictly_below_0.10
      - exact commanded_feasible_safe_executed trace reconstruction
    rank: minimum semantic-clear geometric restricted completion time
    tie_rule: within_1_percent_choose_lower_speed
    no_eligible_candidate_action: terminal_negative_without_test
  independently_tuned_fixed_teb:
    base_config: fixed_teb_reference
    only_tuned_field: TebLocalPlannerROS.max_vel_x
    grid_mps: [1.20, 1.25, 1.30, 1.35, 1.40]
    eligibility:
      - complete paired calibration matrix
      - zero collision
      - zero emergency_or_interface_failure
      - zero unexplained crash_or_integrity_failure
      - every role_success_count_at_least_teb_tuned_v1
      - no role has clearance point difference below -0.05_m_vs_teb_tuned_v1
    rank: minimum equal_role_weighted_geometric_restricted_completion_time
    tie_rule: within_1_percent_choose_lower_speed
  primary_fair_baseline:
    candidates:
      - TEB-Tuned-V1
      - independently_tuned_fixed_teb_selected
    selection_data: calibration_only
    eligibility: identical_task_collision_emergency_and_clearance_rules
    rank: minimum equal_role_weighted_geometric_restricted_completion_time
    tie_rule: within_1_percent_choose_TEB-Tuned-V1
    frozen_before_held_out_test: true
  transparent_reference:
    method_id: TEB-Default
    primary_baseline_eligible: false
    purpose: historical_transparent_context_only
  test_or_p1_outcomes_may_select_candidate_or_baseline: false

frozen_nonfactor_scope:
  circle_contact_estimator: shared_circle_envelope_first_contact_v1
  predicted_ttc_max_s: 5.0
  evaluator_ttc_horizon_s: 5.0
  overlay_release_confirmation_s: 0.20
  robot_radius_m: 0.62
  minimum_turning_radius_m: 1.20
  all_spatial_obstacle_parameters_frozen: true
  all_optimizer_weights_frozen: true
  all_acceleration_parameters_frozen: true
  scene_geometry_timing_and_evaluator_frozen_within_each_future_release: true
  tracker_classifier_transaction_join_and_failure_semantics_frozen: true
  fixed_teb_nonfactor_fields_frozen: true
  posthoc_threshold_or_timeout_change_allowed: false

offline_safety_envelope:
  maximum_candidate_speed_mps: 1.40
  service_deceleration_mps2: 1.60
  additional_distance_margin_m: 0.25
  latency_components:
    laser_delay_plus_positive_jitter_s: 0.070
    one_supervisor_decision_period_s: 0.200
    command_delay_plus_positive_jitter_s: 0.095
    actuator_speed_time_constant_s: 0.220
    typed_transaction_ack_readback_activation_s: 0.005
    worst_upper_bound_to_control_rate_transition_s: 0.400
    command_timeout_fault_extension_s: 0.500
  formula: speed_times_latency_plus_speed_squared_over_two_service_deceleration_plus_margin
  future_qualification_requirements:
    - component_braking_probe_at_every_noncontrol_grid_level
    - high_speed_to_conflict_overlay_transition_probe_at_every_noncontrol_grid_level
    - ackermann_circle_probe_at_every_noncontrol_grid_level
    - compiled_scene_forward_free_path_audit_against_fault_envelope
    - collision_contact_and_minimum_footprint_clearance_replay
    - fail_closed_transaction_and_command_timeout_probe
  offline_design_does_not_safety_qualify_new_bound: true

global_research_budget:
  program_id: fam_teb_post_p1_effect_search_v1
  maximum_factor_rounds: 3
  total_new_simulation_evidence_units_max: 2200
  total_new_training_environment_steps_max: 120000
  budget_expansion_or_transfer_between_rounds_allowed: false
  stop_all_performance_search_after_first_full_positive_gate: true
  rounds:
    - round: 1
      factor_stage: V2-04G-P2
      factor: p2_cruise_forward_velocity_ceiling_v1
      simulation_evidence_units_max: 792
      training_environment_steps_max: 0
      one_sided_alpha: 0.025
      seed_namespace: [5301, 5490]
    - round: 2
      factor_stage: future_unselected_single_factor
      simulation_evidence_units_max: 704
      training_environment_steps_max: 60000
      one_sided_alpha: 0.015
      seed_namespace: [5601, 5790]
    - round: 3
      factor_stage: future_unselected_single_factor
      simulation_evidence_units_max: 704
      training_environment_steps_max: 60000
      one_sided_alpha: 0.010
      seed_namespace: [5901, 6090]
  unused_alpha_or_budget_recycling_allowed: false
  alpha_spend_sum: 0.050
  later_round_requires_new_trace_based_single_factor_preregistration: true

