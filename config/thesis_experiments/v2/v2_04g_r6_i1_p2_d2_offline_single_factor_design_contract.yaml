      - circle_contact_selected
    maximum_planned_evidence_units: 450
    each_frozen_identity_attempt_limit: 1
    retry_resume_replacement_or_seed_substitution_allowed: false
    opened_only_after_calibration_selection_freeze: true
  round_1_maximum_evidence_units: 792

held_out_statistics:
  statistical_unit: paired_scene_seed_block
  analysis_population: intention_to_treat_all_consumed_identities
  restricted_completion_time: navigation_time_for_clean_success_else_frozen_scene_timeout
  primary_efficiency_estimand: >-
    Equal-role-weighted geometric restricted-completion-time reduction of
    circle_contact_selected relative to the calibration-frozen strongest fair
    baseline across the three held-out scene roles.
  required_secondary_causal_estimand: >-
    Semantic-clear geometric restricted-completion-time reduction of
    circle_contact_selected relative to circle_contact_v120.
  uncertainty:
    method: paired_scene_role_stratified_bootstrap_on_mean_log_ratio
    resamples: 10000
    one_sided_alpha: 0.025
    deterministic_rng: sha256_counter_p2_round1_v1
  minimum_effect:
    point_reduction_fraction_at_least: 0.10
    one_sided_confidence_lower_fraction_at_least: 0.05
    required_for_both_primary_and_secondary_estimands: true
  multiplicity:
    global_alpha_spending_applies: true
    round_1_familywise_alpha: 0.025
    fixed_gatekeeping_order:
      - integrity
      - success_collision_emergency_noninferiority
      - clearance_noninferiority
      - projection_and_execution_integrity
      - strongest_fair_baseline_efficiency
      - circle_contact_v120_causal_efficiency
    additional_secondary_family_adjustment: holm
  sample_size:
    paired_blocks_per_role: 30
    assumed_sd_paired_log_time: 0.15
    target_reduction_fraction: 0.10
    target_power: 0.90
    approximate_required_pairs_max: 22

positive_decision_rule:
  all_conditions_required: true
  complete_exact_matrix_and_raw_replay: true
  unexplained_crash_or_integrity_failure_count_max: 0
  dropped_replaced_or_retried_identity_count_max: 0
  success_probability_difference_lower_bound_min: -0.05
  collision_probability_difference_upper_bound_max: 0.05
  emergency_probability_difference_upper_bound_max: 0.05
  treatment_harmful_discordance_excess_per_role_max: 0
  clearance_difference_one_sided_lower_min_m: -0.05
  clearance_difference_point_min_each_role_m: -0.05
  normal_projection_rate_strictly_below: 0.10
  true_conflict_ttc_status_match_fraction_min: 0.95
  parameter_transaction_invalid_count_max: 0
  primary_and_secondary_efficiency_effect_gate_required: true
  decision_if_any_condition_fails: obvious_performance_improvement_not_demonstrated

failure_and_leakage_policy:
  all_failures_retained_and_indexed: true
  timeout_collision_planner_failure_and_post_consumption_crash_retained: true
  failed_episode_deletion_allowed: false
  seed_replacement_allowed: false
  test_access_for_training_calibration_selection_or_thresholds_allowed: false
  test_candidate_rerun_allowed: false
  threshold_relaxation_after_outcome_allowed: false
  post_consumption_integrity_failure_action: terminal_negative_and_forfeit_remaining_stage_budget
  ordinary_candidate_failure_action: retain_result_and_continue_only_as_exact_schedule_predeclares
  round_failure_action: freeze_negative_then_allow_only_one_new_trace_based_preregistered_factor

future_stage_requirements:
  required:
    - versioned_candidate_bank_materialization_with_exact_nonfactor_diff_audit
    - exact_calibration_and_qualification_schedule
    - independent_offline_review
    - unique_frozen_release_and_budget
    - separate_corresponding_simulation_authorization
    - calibration_selection_freeze_before_test_release
    - unique_held_out_test_release_and_budget
    - separate_corresponding_test_simulation_authorization
    - raw_resource_hash_journal_failure_index_and_deterministic_replay
  current_contract_is_not_a_release_or_execution_authorization: true

claim_boundary:
  allowed_after_this_offline_stage_only:
    - one_executable_factor_and_finite_program_are_preregistered
    - proposed_1_40_mps_bound_is_offline_design_admissible_for_future_qualification
    - fair_baseline_selection_and_held_out_effect_gates_are_frozen
  forbidden_without_future_positive_held_out_result:
    - performance_improvement
    - reinforcement_learning_improvement
    - new_speed_bound_safety_qualification
    - winner_or_runtime_ready
    - cross_geometry_or_real_vehicle_generalization
    - deployment_readiness

forbidden_side_effects:
  rerun_resume_or_modify_i5_p1_or_t12: true
  modify_or_delete_frozen_evidence: true
  start_ros_gazebo_move_base_or_training: true
  create_execution_release_schedule_journal_or_budget_consumption: true
  modify_active_runtime_profile_or_write_online_parameters: true
  access_held_out_test_outcomes: true
  connect_stable_workspace_real_vehicle_can_or_hardware: true
