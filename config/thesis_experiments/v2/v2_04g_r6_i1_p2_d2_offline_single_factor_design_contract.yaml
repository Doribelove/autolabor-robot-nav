objective: >-
  Convert the P2-D1 longitudinal-headroom finding into exactly one executable,
  versioned simulation factor and a finite, leakage-resistant research program.
  The factor may improve FAM-TEB only by changing the forward velocity ceiling;
  every semantic, spatial, acceleration, evaluator and safety mechanism remains
  frozen. A positive result must beat the strongest calibration-frozen fair
  fixed-TEB baseline, not merely a transparent weak reference.

