  join_limits:
    maximum_entries: 32
    maximum_arrival_age_s: 1.0
    maximum_sequence_delta: 2
    maximum_timestamp_delta_s: 0.45
    future_sequence_allowed: false
    future_timestamp_allowed: false

fault_taxonomy:
  classes:
    CLEAN:
      predicate: fault_reason is empty
      hard_fault: false
    EXPECTED_FAIL_CLOSED_CONTEXT_HOLD:
      exact_reason: invalid_or_faulted_context_hold_previous_executed
      meaning: invalid or FAULTED context caused the transaction loop to hold the previous executed profile
      hard_fault: false
    BACKEND_TRANSACTION_FAULT:
      case_insensitive_substrings:
        - acknowledgement
        - readback
        - restore
        - dynamic_reconfigure
        - timed out
        - timeout
        - outside live bounds
        - typed request
      meaning: typed request, acknowledgement, readback, timeout, or restore failure
      hard_fault: true
    UNKNOWN_TRANSACTION_FAULT:
      predicate: nonempty fault_reason not matched above
      hard_fault: true
  classification_order:
    - CLEAN
    - EXPECTED_FAIL_CLOSED_CONTEXT_HOLD
    - BACKEND_TRANSACTION_FAULT
    - UNKNOWN_TRANSACTION_FAULT
  required_fault_snapshot_fields:
    - full fault_reason
    - fault taxonomy class
    - transaction stamp, world_model_seq, mode_seq, and config_seq
    - transaction valid and activated flags
    - geometry, overlay, and transition enums
    - execution backend
    - latest ContextState validity, reason, sequence, enums, and arrival age
    - latest mechanism join validity, reason, deltas, and transaction state

stable_readiness_window:
  source_stream: /teb_mode_manager/mechanism_state
  required_consecutive_stable_count: 10
  stable_predicate:
    join_valid: true
    transaction_valid: true
    transaction_activated: true
    transaction_fault_reason: empty
  reset_to_zero_on_any_unstable_message: true
  measurement_starts_only_after_barrier: true
  warmup_timeout_s: 12.0

measurement:
  duration_s: 6.0
  minimum_message_count_per_stream: 20
  minimum_transaction_activated_fraction: 0.95
  minimum_transaction_valid_fraction: 0.95
  minimum_join_valid_fraction: 0.95
  maximum_expected_context_hold_count: 1
  maximum_backend_transaction_fault_count: 0
  maximum_unknown_transaction_fault_count: 0
  allowed_join_reasons: [EXACT_SEQUENCE_JOIN, BOUNDED_SEQUENCE_TIME_JOIN]
  required_execution_backend: simulation_teb_dynamic_reconfigure
  training_message_count_max: 0

hard_gates:
  all_six_probes_required: true
  consecutive_stable_readiness_required: true
  complete_fault_taxonomy_required: true
  full_fault_snapshots_required_for_every_nonempty_reason: true
  backend_transaction_fault_count_max: 0
  unknown_transaction_fault_count_max: 0
  expected_context_hold_count_max_per_probe: 1
  join_valid_fraction_min_per_probe: 0.95
  transaction_valid_fraction_min_per_probe: 0.95
  transaction_activated_fraction_min_per_probe: 0.95
  runtime_scene_labels_or_manifest_access: forbidden
  learned_policy_loaded: false

stopping_rules:
  - any failed probe stops the round and preserves completed evidence
  - a failed report cannot be overwritten or retried inside this round
  - budget expansion is forbidden
  - navigation, TTC qualification, SAC, and real vehicle are outside this round

pass_boundary:
