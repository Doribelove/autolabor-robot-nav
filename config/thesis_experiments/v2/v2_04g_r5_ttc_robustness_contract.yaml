  control_value_s: 5.0
  repair_candidate_values_s: [4.5, 4.0]
  rationale: >-
    The evaluator relative-motion envelope remains frozen at 5.0 s. Reducing
    only the runtime supervisor horizon creates a 0.5--1.0 s separation from
    that evaluator horizon while retaining a 4.0 s maximum runtime prediction
    window. This is not a guaranteed reaction time; safety and clearance
    remain hard gates.
