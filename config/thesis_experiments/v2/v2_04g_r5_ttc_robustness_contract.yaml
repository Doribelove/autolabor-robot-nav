execution_order:
  - validate frozen resources and seed firewall offline
  - six scene-based TTC activation-and-coverage readiness episodes on three fresh probe-only seeds
  - three deterministic TTC component identities without navigation seeds
  - fifteen Fixed TEB episodes on fresh navigation calibration seeds
  - fifteen control-horizon episodes on the same fresh navigation seeds
  - fifteen 4.5-second candidate episodes on the same fresh navigation seeds
  - fifteen 4.0-second candidate episodes on the same fresh navigation seeds
  - fail-closed hard-gate assessment
  - stop and wait for a separate winner-freeze instruction

stopping_rules:
  - any TTC activation-and-coverage readiness failure stops before component TTC and navigation
  - TTC component coverage failure stops before navigation
  - any terminal evidence failure stops immediately and permanently records the identity
  - no failed identity may be retried in the same run or after resume
  - fixed-reference collision or fewer than 14 successes invalidates the split
  - candidate collision, incomplete evidence or any hard-gate failure disqualifies that candidate
  - no early performance selection, no seed replacement and no budget expansion
  - no passing candidate means stop without winner, held-out or V2-05

