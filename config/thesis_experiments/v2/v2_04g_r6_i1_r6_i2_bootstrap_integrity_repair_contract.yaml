  scene_change_allowed: false
  evaluator_change_allowed: false
  anchor_or_mechanism_change_allowed: false
  runtime_profile_write_allowed: false

repair_scope:
  exact_repair_count: 6
  repairs:
    R6-I2-BOOTSTRAP-CLOCK:
      source_finding: R6-I1 paused_sim_time_bootstrap_order_deadlock
      required_order:
        - base_spawn
        - unpause_request
        - successful_unpause_ack
        - first_strictly_positive_post_ack_clock
        - second_strictly_greater_positive_post_ack_clock
        - release_move_base_and_teb_service_wait
      fail_closed_on:
        - unpause_failure
        - zero_only_clock
        - repeated_positive_clock_without_progress
        - regressing_clock
        - deadline
        - base_exit_before_release
    R6-I2-EXTERNAL-HASH-CLOSURE:
      source_finding: R6-I1-POST-02
      inherited_python_binding_count: 39
      runtime_binding_count: 5
      canonical_path_and_sha256_required: true
      interpreter_or_builtin_provider_required: true
      unresolved_count_required: 0
    R6-I2-AUTHORIZATION-CLOSED-SCHEMA:
      source_finding: R6-I1-POST-03
      closed_type_sensitive_schema_required: true
      exact_schedule_required: true
      every_resource_required: true
      independent_closure_digest_required: true
      every_scope_and_safety_flag_required: true
    R6-I2-SINGLE-OPEN-HASH-PARSE:
      source_finding: R6-I1-POST-04
      every_path_component_no_follow_required: true
      one_regular_file_descriptor_required: true
      one_byte_snapshot_for_hash_and_parse_required: true
      duplicate_yaml_keys_rejected: true
      file_identity_stability_required: true
    R6-I2-DETERMINISTIC-ASSESSOR:
      source_finding: R6-I1-POST-05
      all_source_values_explicit_parameters: true
      free_variable_stage_reference_allowed: false
      write_or_execution_side_effect_allowed: false
      repeated_build_must_match: true
    R6-I2-CREDENTIAL-SAFE-LOGGING:
      source_finding: R6-I1-SENSITIVE-LOG-CLEANUP
      exact_child_environment_allowlist_required: true
      loopback_ros_master_required: true
      attempt_confined_ros_home_and_log_dir_required: true
      credential_like_keys_and_values_persisted: false
      argv_credential_rejection_required: true
      pre_persistence_log_redaction_required: true

