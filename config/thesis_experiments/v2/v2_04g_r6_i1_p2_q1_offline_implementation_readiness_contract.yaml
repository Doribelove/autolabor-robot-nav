runner_adapter:
  mode: release_gated_offline_command_plan
  supported_row_types: [calibration_navigation, qualification_probe]
  preflight_rehashes_schedule_scene_and_method_bindings: true
  builds_exact_command_plan_for_every_row: true
  credential_safe_child_environment_required: true
  positive_progress_clock_bootstrap_required: true
  process_isolation_and_two_phase_teardown_required: true
  consumption_boundary_for_future_release: base_roslaunch_spawn_requested
  current_execute_entry_hard_disabled_without_future_release: true
  future_release_must_bind_runner_sha_and_exact_schedule_sha: true
  future_release_must_supply_exact_expected_release_sha: true

raw_replay_adapter:
  summary_fields_trusted_as_statistics: false
  navigation_sample_integrity_fields:
    [tracker_valid, transaction_valid, projection_applied, emergency]
  qualification_sample_integrity_fields:
    [transaction_valid, projection_applied, emergency]
  navigation_trace_recomputes:
    - success
    - collision
    - restricted_completion_time
    - minimum_footprint_clearance
    - observed_ttc_status
    - emergency
    - normal_projection_rate
    - invalid_transaction_count
  qualification_trace_recomputes:
    braking: [initial_speed_mps, stop_time_s, stopping_distance_m, collision]
    high_speed_to_conflict_overlay_transition: [activation_latency_s, maximum_speed_before_safe_state_mps, collision, minimum_clearance_m]
    ackermann_circle: [steady_speed_mps, steady_yaw_rate_radps, radius_m, radius_error_m, collision]
  raw_path_sha_size_receipts_required: true
  deterministic_synthetic_fixtures_required: true
  future_replay_of_all_consumed_rows_required: true

qualification_thresholds:
  braking:
    candidate_speed_tolerance_mps: 0.05
    maximum_stop_time_s: 2.50
    maximum_stopping_distance_m: 2.9485
    collision_allowed: false
  high_speed_to_conflict_overlay_transition:
    maximum_activation_latency_s: 0.99
    maximum_speed_at_safe_state_mps: 1.20
    minimum_clearance_m: 0.25
    collision_allowed: false
  ackermann_circle:
    steady_speed_tolerance_mps: 0.08
    maximum_radius_error_m: 0.20
    collision_allowed: false
  any_probe_failure_disqualifies_that_speed_and_higher_speeds: true
  qualification_results_may_not_open_held_out_test: true

future_calibration_release_boundary:
  release_present: false
