  ordinary_candidate_or_probe_failure_does_not_delete_or_retry_identity: true
  preconsumption_integrity_failure_stops_without_consumption: true
  postconsumption_integrity_failure_stops_stage_and_forfeits_remainder: true
  outcome_based_schedule_or_config_rewrite_allowed: false
  hidden_test_access_or_test_artifact_creation_is_integrity_failure: true
  unexplained_crash_allowed_for_positive_selection: false

claim_boundary:
  allowed_after_q1_offline_pass:
    - exact_candidate_scene_schedule_runner_and_replay_inputs_are_offline_materialized
    - every_candidate_diff_is_confined_to_the_preregistered_single_behavioral_field
    - calibration_and_qualification_release_prerequisites_are_statically_reviewed
  forbidden:
    - candidate_or_speed_safety_qualified
    - calibration_or_performance_result
    - baseline_or_treatment_selected
    - reinforcement_learning_improvement
    - held_out_test_access
    - release_execution_authorization_or_budget_consumption
    - runtime_ready_winner_deployment_or_real_vehicle_claim

forbidden_side_effects:
  modify_p1_i5_t12_or_p2_d2_frozen_evidence: true
  modify_active_runtime_profiles: true
  create_held_out_test_scene_schedule_result_or_artifact: true
