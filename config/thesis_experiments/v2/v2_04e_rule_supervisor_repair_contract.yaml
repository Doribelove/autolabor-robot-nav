  explicitly_not_optimized:
    - v2_04d_validation_metrics
    - anchor_parameter_values
    - sac_policy

split_boundary:
  permitted_split: calibration
  calibration_seed_range: [4701, 4705]
  forbidden_historical_validation_seed_range: [4601, 4610]
  forbidden_inputs:
