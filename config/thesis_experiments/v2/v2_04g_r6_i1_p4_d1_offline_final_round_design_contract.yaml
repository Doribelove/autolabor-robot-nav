objective: >-
  Spend the third and final global search round on exactly one trace-attributed
  action/execution-schema amendment: promote the five frozen P2-Q1
  circle-contact candidate banks into the strict uncalibrated simulation
  candidate lifecycle and remove their offline-only provenance extension.
  Preserve all behavioral TEB values, bounds, safety gates, scene templates,
  evaluators, statistical gates and fair baselines.  Require a one-unit fresh
  semantic preflight before calibration and one-time held-out testing.

