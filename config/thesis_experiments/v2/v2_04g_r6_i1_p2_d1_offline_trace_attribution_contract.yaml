scientific_question:
  factor_hypothesis_id: semantic_clear_post_cruise_longitudinal_release
  question: >-
    Does the already recorded P1 semantic-clear treatment trace contain enough
    same-path longitudinal headroom for a future single-factor design to target
    an aggregate 8--10 percent restricted-completion-time reduction relative to
    the paired legacy control?
  target_population: >-
    The 30 frozen time_separated_semantic_clear P1 paired blocks at seeds
    5261--5290; this is not a claim about other geometries, simulators, or a real
    vehicle.
  factor_scope:
    eligibility: >-
      circle-contact treatment after the first observed anchor_cruise sample in
      a semantic-clear episode
    changed_quantity_class: longitudinal envelope utilization only
    frozen_prefix: goal dispatch through the first anchor_cruise sample
    frozen_path_geometry: true
    frozen_spatial_obstacle_parameters: true
    frozen_semantic_estimator_and_overlay: true
    frozen_scene_seed_and_evaluator: true
    executable_runtime_field_selected: false
    reason_runtime_field_not_selected: >-
      P2-D1 is attribution and physical-room screening. It must not convert an
      ideal envelope into an executable or causally qualified parameter.

