trace_selection:
  scene_role: time_separated_semantic_clear
  seeds: {start: 5261, end: 5290, count: 30}
  paired_methods:
    control: r6_semantics_legacy_control
    treatment: r6_semantics_circle_contact
  treatment_trace_count: 30
  sample_window: goal_dispatch_through_first_goal_reached_inclusive
  post_terminal_accounting_s: preserve_observed_navigation_time_minus_observation_duration
  retries_replacements_or_exclusions_allowed: false

analysis_definition:
  primary_estimand: >-
    one minus the geometric mean of frozen-prefix same-path envelope times
    divided by the geometric mean of paired legacy restricted completion times
  current_longitudinal_constraints:
    max_vel_x_mps: 1.2
    acc_lim_x_mps2: 0.8
    terminal_velocity_mps: 0.0
  cap_bound_observation_threshold:
    fraction_of_current_max_vel_x: 0.95
    actual_speed_threshold_mps: 1.14
  motion_command_threshold_mps: 0.05
  phase_distance_fractions: [0.1, 0.9]
  uncertainty:
    method: paired_seed_bootstrap_on_mean_log_ratio
    resamples: 10000
    seed: 20260722
    deterministic_rng: sha256_counter_p2_d1_v1
    one_sided_alpha: 0.05
  target_reductions: [0.08, 0.10]
  physical_room_gate:
    envelope_point_reduction_at_least: 0.10
    one_sided_95_percent_lower_at_least: 0.10
    all_30_blocks_retained: true
    raw_trace_and_evaluation_hashes_match_journals: true
  cap_exposure_sensitivity: >-
    Preserve all non-cap-bound observed time and scale only actual-speed
    cap-bound dwell by the inverse of a hypothetical longitudinal multiplier.
    This is a first-order exposure calculation, not a dynamically executable
    trajectory.

interpretation_boundary:
  physical_room_pass_means: >-
    The aggregate 8--10 percent target lies inside a conservative same-path
    longitudinal envelope of the frozen traces.
  physical_room_pass_does_not_mean:
    - a runtime parameter has been qualified
    - the counterfactual time will be achieved
    - a causal performance improvement has been demonstrated
    - P1 has changed from its frozen negative four-gate conclusion
    - safety at a higher speed has been established
  historical_screen_status: descriptive_direction_check_only
  future_requirement: >-
    A later design stage must choose exactly one executable runtime factor,
    establish safe bounds, use fresh identities, and pass independent offline
    review before any separately authorized simulation.

forbidden_side_effects:
  rerun_or_resume_i5: true
  rerun_resume_or_extend_p1: true
  start_ros_gazebo_or_move_base: true
  create_execution_release_attempt_journal_or_consumption: true
  consume_seed_evidence_or_training_budget: true
  start_or_expand_training: true
  modify_p1_thresholds_or_drop_samples: true
  modify_runtime_profiles_or_online_parameters: true
  connect_real_vehicle: true
