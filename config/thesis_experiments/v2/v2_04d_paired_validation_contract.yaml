  aggregation: paired_median
  comparisons:
    - [balanced_anchor, fixed_teb]
    - [rule_multi_anchor, fixed_teb]
    - [rule_multi_anchor, balanced_anchor]
  common_metrics:
    navigation_time_s: minimize
    path_length_m: minimize
    minimum_clearance_m: maximize
    stop_count: minimize
    reverse_distance_m: context_dependent
  family_metrics:
    CRUISE: [lateral_rms_m, heading_oscillation_rad, unnecessary_deceleration_count]
    DYNAMIC: [minimum_predicted_ttc_s, stop_count, interaction_clearance_m]
    STATIC_DENSE: [topology_switch_count, global_replan_count, recovery_count]
    CORRIDOR: [lateral_rms_m, heading_oscillation_rad, emergency_contact_count]
    MANEUVER: [gear_switch_count, gear_switch_while_moving_count, reverse_distance_m]
  claim_rule:
    no_single_scalar_score: true
    success_and_safety_reported_before_performance: true
    family_tradeoffs_reported_without_post_hoc_weighting: true

