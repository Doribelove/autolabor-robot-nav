  failure by changing exactly one trace-attributed execution-alignment factor:
  separate the frozen runtime semantic profile identity from the candidate
  evidence identity.  Preserve the P2 speed-treatment grid and every behavioral,
  safety, evaluator and statistical definition.  Spend round-2 budget through
  a one-unit semantic preflight, then calibration, then one-time held-out test.

