  - independent_consumer_allowlist_and_runtime_profile_review
  - exact_I1_release_schedule_and_one_unit_budget
  - separate_explicit_I1_simulation_authorization
  - complete_raw_replay_and_terminal_accounting
  - no_C1_or_T1_release_before_their_predecessor_gate

forbidden_side_effects:
