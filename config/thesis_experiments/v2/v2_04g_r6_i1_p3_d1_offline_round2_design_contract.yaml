phase_gates:
  I1:
    release_scope: one_fresh_semantic_overlay_qualification_identity
    required_integrity:
      - supervisor_accepts_runtime_profile_r6_semantics_circle_contact
      - positive_progress_clock_bootstrap
      - exact_transaction_startup_arm_activation_restore
      - raw_trace_path_SHA_size_receipt
      - runtime_profile_and_evidence_identity_both_reconstructible
      - no_unexplained_process_exit
      - final_process_isolation_clean
    ordinary_probe_pass_required_to_open_C1: true
    release_retry_or_resume_allowed: false
  C1:
    complete_12_probe_qualification_matrix_required: true
    lower_to_higher_monotone_speed_disqualification: true
    complete_paired_calibration_matrix_for_each_eligible_method: true
    calibration_only_candidate_and_baseline_selection: true
    raw_replay_before_selection: true
  T1:
    exact_candidate_and_primary_baseline_freeze_required: true
    exact_fresh_paired_schedule_required: true
    test_outcome_access_before_release_forbidden: true
    each_identity_runs_once: true

calibration_selection:
  circle_contact_candidate:
    eligibility:
      - complete_eligible_paired_calibration_matrix
      - zero_collision
      - zero_emergency_or_interface_failure
      - zero_unexplained_crash_or_integrity_failure
      - no_role_success_count_below_circle_contact_v120
      - no_role_clearance_point_difference_below_minus_0_05_m
      - normal_projection_rate_strictly_below_0_10
    rank: minimum_semantic_clear_geometric_restricted_completion_time
    tie_rule: within_1_percent_choose_lower_speed
  independently_tuned_fixed_teb:
    only_tuned_field: TebLocalPlannerROS.max_vel_x
    eligibility_and_rank: frozen_from_P2_D2
  primary_fair_baseline:
    candidates: [TEB-Tuned-V1, independently_tuned_fixed_teb_selected]
    selection_data: calibration_only
    rank: minimum_equal_role_weighted_geometric_restricted_completion_time
    tie_rule: within_1_percent_choose_TEB-Tuned-V1
  TEB_Default_primary_baseline_allowed: false

held_out_statistics:
  statistical_unit: paired_scene_seed_block
  primary_efficiency_estimand: >-
    Equal-role-weighted geometric restricted-completion-time reduction of the
    selected circle-contact candidate relative to the calibration-frozen
    strongest fair baseline.
  required_secondary_estimand: >-
    Semantic-clear geometric restricted-completion-time reduction relative to
    frozen circle_contact_v120.
  uncertainty:
    method: paired_scene_role_stratified_bootstrap_on_mean_log_ratio
    resamples: 10000
    one_sided_familywise_alpha: 0.015
    deterministic_rng: sha256_counter_p3_round2_v1
    multiple_comparison_control: fixed_gatekeeping_then_Holm
  obvious_improvement_gate:
    point_reduction_fraction_at_least: 0.10
    one_sided_confidence_lower_fraction_at_least: 0.05
    required_for_primary_and_secondary: true

safety_and_integrity_gate:
  complete_intention_to_treat_matrix_required: true
  unexplained_crash_or_integrity_failure_count_max: 0
  dropped_replaced_or_retried_identity_count_max: 0
  success_probability_difference_lower_bound_min: -0.05
  collision_probability_difference_upper_bound_max: 0.05
  emergency_probability_difference_upper_bound_max: 0.05
  harmful_discordance_excess_per_role_max: 0
  clearance_difference_one_sided_lower_min_m: -0.05
  clearance_difference_point_min_each_role_m: -0.05
  normal_projection_rate_strictly_below: 0.10
  true_conflict_ttc_status_match_fraction_min: 0.95
  parameter_transaction_invalid_count_max: 0
  decision_if_any_gate_fails: obvious_performance_improvement_not_demonstrated

failure_and_leakage_policy:
  retain_and_index_all_failures: true
  successful_only_analysis_allowed: false
  failed_episode_deletion_allowed: false
  seed_replacement_allowed: false
  threshold_relaxation_after_outcome_allowed: false
  test_access_for_training_calibration_or_selection_allowed: false
  test_candidate_rerun_allowed: false
  any_integrity_failure_stops_current_release: true
  remaining_phase_and_round_budget_after_integrity_failure: retire
  no_positive_claim_from_directional_or_calibration_only_result: true

future_stage_requirements:
