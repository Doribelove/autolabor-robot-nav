    - {candidate_id: probe_v080, speed_mps: 0.80}
    - {candidate_id: probe_v100, speed_mps: 1.00}
    - {candidate_id: probe_v120, speed_mps: 1.20}
  scenario_blocks:
    - {block_id: train_6201, role: training, seed: 6201, angle_deg: 70.0, actor_start_distance_m: 2.70, actor_base_speed_mps: 0.90}
    - {block_id: train_6202, role: training, seed: 6202, angle_deg: 90.0, actor_start_distance_m: 3.00, actor_base_speed_mps: 1.00}
