research_sequence:
- fresh multi-scene/multi-actor actual-TEB qualification and formal evaluation
- perception latency/noise/dropout and OOD qualification and formal stress evaluation
- cloned-intervention support, propensity and analytic-regret audit
- conditional supervised ranker, contextual-bandit and then offline-RL training
- separately authorized real-vehicle work last
non_reuse:
  forbidden_seed_ranges:
  - [6801, 6830]
  - [6951, 6967]
  - [7001, 7032]
  - [7101, 7130]
  v3_11_execution_or_budget_reuse: false
  threshold_selection_from_v3_11_formal_outcome: false
minimum_actor_count: 2
maximum_actor_count: 3
vehicle:
  wheelbase_m: 0.65
  maximum_speed_mps: 1.2
  maximum_acceleration_mps2: 0.6
  maximum_deceleration_mps2: 0.8
  maximum_steering_angle_rad: 0.52
  maximum_steering_rate_radps: 0.5
  maximum_curvature_inv_m: 0.45
  ego_half_width_m: 0.365
  ego_circumscribed_radius_m: 0.55
candidate_generator:
  generator_id: v3_13_d0_four_action_ackermann_bank_1
  horizon_s: 7.0
  sample_period_s: 0.05
  outbound_x_range_m: [-2.6, 1.4]
  return_x_range_m: [1.4, 5.4]
  steering_peak_rad: 0.25
  kinematic_residual_max_m_rad: 1.0e-8
  candidates:
  - candidate_id: spatial_left_v120
    kind: spatial
    direction: 1
    target_speed_mps: 1.2
    certified_stop: false
  - candidate_id: spatial_right_v120
    kind: spatial
    direction: -1
    target_speed_mps: 1.2
    certified_stop: false
  - candidate_id: straight_v120
    kind: straight
    direction: 0
    target_speed_mps: 1.2
    certified_stop: false
  - candidate_id: certified_stop_v000
    kind: stop
    direction: 0
    target_speed_mps: 0.0
    certified_stop: true
predictor:
  status: offline_fixture_only_not_fitted_or_qualified
  hidden_policy_runtime_input: false
  mode_inference:
    cautious_max_speed_mps: 0.274012499989
    hesitant_max_speed_mps: 0.758912499986
    ambiguity_half_width_mps: 0.02
  future_requirement:
    candidate_conditioned: true
    per_actor_output: true
    calibrated_simultaneous_coverage: true
    family_held_out: true
hard_verifier:
  required_health_fields:
  - localization_ok
  - transform_ok
  - actor_track_ok
  - command_chain_ok
  maximum_track_age_s: 0.20
  combined_actor_ego_radius_m: 1.02
  aggregate_rule: every_actor_every_time_sample_must_clear
  certified_stop_required: true
  fail_closed_on_mode_ambiguity: true
  fail_closed_on_unsupported_mode: true
analytic_ranker:
  ranker_id: v3_13_d0_progress_clearance_comfort_1
  progress_weight: 1.0
  clearance_weight: 0.25
  acceleration_cost_weight: 0.10
  steering_cost_weight: 0.08
  deterministic_tie_break: lexicographic_candidate_id
scene_families:
- scene_id: dual_crossing_staggered_open
  family: dual_crossing
  corridor_half_width_m: null
  actor_paths:
  - {track_id: actor_a, conflict_x_m: 0.0, conflict_y_m: 0.0, angle_deg: 90.0}
  - {track_id: actor_b, conflict_x_m: 2.2, conflict_y_m: 0.0, angle_deg: 110.0}
- scene_id: dual_crossing_opposed_wide
  family: opposed_oblique
  corridor_half_width_m: 2.0
  actor_paths:
