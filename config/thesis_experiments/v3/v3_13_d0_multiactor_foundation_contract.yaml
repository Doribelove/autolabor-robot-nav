  actor_paths:
  - {track_id: actor_a, conflict_x_m: 0.5, conflict_y_m: 0.0, angle_deg: 90.0}
  - {track_id: actor_b, conflict_x_m: 3.0, conflict_y_m: 0.0, angle_deg: 75.0}
- scene_id: crossing_and_oncoming
  family: mixed_interaction
  corridor_half_width_m: 2.0
  actor_paths:
  - {track_id: actor_a, conflict_x_m: 0.0, conflict_y_m: 0.0, angle_deg: 90.0}
  - {track_id: actor_b, conflict_x_m: 2.0, conflict_y_m: 0.0, angle_deg: 180.0}
