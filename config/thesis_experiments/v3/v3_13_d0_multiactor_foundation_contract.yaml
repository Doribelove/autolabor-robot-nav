  - latency_100ms
  - latency_200ms
  - position_noise_0p10m
  - position_noise_0p20m
  - dropout_10pct
  - dropout_burst_300ms
  - ood_speed_and_angle
  evaluate_raw_truth_separately_from_planner_track: true
  both_methods_receive_same_degraded_dynamic_track: true
  no_perception_claim_from_oracle_stage: true
