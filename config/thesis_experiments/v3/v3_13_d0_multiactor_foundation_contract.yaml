  primary_metric: restricted mean gate-to-goal time reduction versus actual TEB
  point_reduction_percent_min: 10.0
  one_sided_lower_reduction_percent_min: 5.0
  every_scene_family_mean_reduction_percent_min: 0.0
  collision_count_max: 0
  v3_goal_success_noninferiority_margin: 0.0
