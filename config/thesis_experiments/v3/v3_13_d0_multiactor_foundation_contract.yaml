schema_version: '1.0'
architecture_generation: v3
stage: V3-13-D0
stage_purpose: pure_offline_multiscene_multiactor_perception_and_learning_foundation
status: zero_authority_offline_foundation
upstream:
  actual_teb_formal_handoff: docs/thesis_experiment/CURRENT_V3_11_ACTUAL_TEB_FORMAL_HANDOFF.md
  v3_11_terminal_freeze_sha256: f4396e25716dfb13bdc3e8d33a02387c117ab5a8c066e0d6a3e94b2fe3ac7465
  v3_12_terminal_freeze_sha256: 4e94be77a82acd172cb4f1924f80ccb2abe9e47d7cfda0d4d6eefbf55c988cc9
