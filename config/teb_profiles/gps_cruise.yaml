TebLocalPlannerROS:
  # Open roads and long straight segments: look farther ahead and favor a
  # smooth, time-efficient path that stays close to the global plan.
  # The 20 x 20 m local costmap clips usable plan distance to about 8.5 m.
  max_global_plan_lookahead_dist: 8.0
  global_plan_viapoint_sep: 1.0

  # The forward speed limit is supplied by bringup.sh.  At the 1.2 m hardware
  # minimum turning radius, 1.5 m/s requires 1.25 rad/s of yaw rate.  Keep a
  # small optimization margin above that value so a normal cruise turn is not
  # forced below about 0.96 m/s by the former 0.8 rad/s limit.
  max_vel_theta: 1.3
  min_vel_theta: -1.3
  # When any component reaches its limit, scale the complete Twist together.
  # This preserves Ackermann curvature instead of demanding more steering at
  # a lower linear speed.
  use_proportional_saturation: true
  # The chassis' theoretical limit is about 1.22 m; retain steering margin so
  # normal tracking does not sit on the mechanical limit.
  min_turning_radius: 1.35
  acc_lim_x: 2.5
  # Build steering curvature promptly instead of spending several seconds at
  # near-zero speed while respecting an overly gentle yaw-acceleration limit.
  acc_lim_theta: 0.8

  weight_max_vel_x: 5.0
  weight_max_vel_theta: 30.0
  weight_acc_lim_x: 20.0
  weight_acc_lim_theta: 200.0
  weight_kinematics_turning_radius: 1000.0
  weight_optimaltime: 6.0
  weight_shortest_path: 8.0
  weight_viapoint: 12.0

  # On an open route a single topology avoids unnecessary candidate changes.
  enable_homotopy_class_planning: false
  max_number_classes: 1
  costmap_obstacles_behind_robot_dist: 0.5
  obstacle_poses_affected: 15
