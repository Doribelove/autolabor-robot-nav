diagnosis:
  maneuver_reverse_root_cause: >-
    The R1 minimum heading-error threshold was 1.90 rad, while the observed
    Maneuver-mode absolute heading error was at most 0.846 rad; rear coverage
    and rear clearance were otherwise valid.
  static_time_root_cause: repeated_stops_and_parameter_callback_disturbance
  one_hz_result: rejected_as_global_fix
  one_hz_reason: >-
    It increased balanced Static time to 28.9 s and did not provide a stable
    cross-candidate improvement.
  retained_factors:
    - heading-independent reverse selection still bounded by rear/front clearance
    - higher target-family velocity and acceleration envelopes
    - idempotent coalescing of already-active typed TEB transactions
  frozen_factors:
    - R1 bounded sequence/timestamp cache join source and limits
    - four-stage commanded/feasible/safe/executed action semantics
    - rule supervisor has no runtime scene labels or manifest access
