  primary_observations:
  - Validation trend is inconsistent across seeds; the cross-seed mean change is 0.187157,
    which does not satisfy the per-seed learning gate.
  - The repaired curriculum covers all 5 intended training scenes.
  - Training projection intervenes on 67.3% of steps; the dominant reason is max_vel_theta:ackermann_turning_radius.
  - Projection occurs on 95.7% of steps after a safety intervention versus 46.8% without
    a preceding safety intervention; rate-limit projection is therefore mostly a return-from-safety
    effect.
  - Most training episodes now exceed one four-step hold window, but they still contain
    only a small number of independent decisions.
  - The mean first-step previous-theta-to-anchor normalized L1 distance is 0.
  - Safety intervention and risk scaling activate in the repaired obstacle/corridor
    curriculum without emergency or fault fallback.
  - The fixed TEB-Tuned anchor is strong; test goal completion alone does not isolate
    a learned residual benefit.
  next_gate: preregister_one_residual_projection_alignment_factor_then_small_budget_pilot
