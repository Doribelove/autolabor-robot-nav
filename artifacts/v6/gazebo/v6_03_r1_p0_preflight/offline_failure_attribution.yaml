root_causes:
  - id: shield_evaluator_geometry_mismatch
    finding: >-
      The deployed scan shield used robot radius 0.46 m plus inflation 0.12 m,
      while the frozen evaluator used combined centre separation 1.15 m with
      actor radius 0.36 m.  The equivalent scan-surface inflation is therefore
      1.15 - 0.36 - 0.46 = 0.33 m, leaving a deterministic 0.21 m mismatch.
  - id: report_schema_omission
    finding: >-
      The V6 override called the inherited warmup directly but did not add the
      inherited evaluator-only actor-mode audit fields before serialization;
      the original summarizer therefore raised KeyError after all three units.
single_repair_stage:
  stage: V6-03-R2
  behavioral_factor: align_runtime_hard_shield_inflation_from_0.12_to_0.33_m
  nonbehavioral_repair: restore_evaluator_only_actor_mode_audit_field
