gate_rationale:
  excitation: 0.45rad produces about0.7431/m curvature; 3s permits slew reversal1.2s plus settling and
    at least1rad actual yaw excitation
  saturation: requests plus/minus0.65rad exceed configured0.4964rad; actual front limits are independently
    read from effective URDF, not set equal to center limit
  front_angle_tolerance: 0.01rad actual-joint and0.015rad center tolerances are fixed solver/link-estimation
    diagnostic tolerances, not actuator limit changes
  actual_rate_tolerance: one2ms physics step within20ms source intervals is10percent sampling phase; center0.10rad/s
    and front0.20rad/s fixed diagnostic tolerance, strict internal0.75rad/s still checked separately
  command_stop: from1.2m/s, rate-limited braking takes1.333s plus first-order tail;3s command brake and4s
    command loss including0.5s timeout leave a settled0.75s tail
  source_sampling: 50Hz means0.020s; one0.002s physics step margin permits state gap0.022s; contact gap
    permits at most one missed500Hz packet
  position_agreement: 5mm exceeds two physics steps at1.2m/s=4.8mm; yaw5mrad exceeds two steps at approximately1rad/s;
    this is a measurement-consistency gate, not general safety accuracy
  phase_counts: 95percent command coverage and75ms maximum gap detect missed20Hz sends; loss interval
    deliberately contains no sends
  derivatives: Actual physical odom and pose derivatives are measured separately. Only target derivatives
    are checked against internal .6/.9/.75 limits; force tracking effects remain actual observations.
