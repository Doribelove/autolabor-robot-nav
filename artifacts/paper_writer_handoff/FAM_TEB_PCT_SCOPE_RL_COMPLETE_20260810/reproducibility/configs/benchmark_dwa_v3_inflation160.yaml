local_costmap:
  inflation_layer:
    inflation_radius: 1.60
    cost_scaling_factor: 1.0
global_costmap:
  inflation_layer:
    inflation_radius: 1.60
    cost_scaling_factor: 1.0

DWAPlannerROS:
  odom_topic: /odom
  global_frame_id: odom
  holonomic_robot: false
  max_vel_x: 1.20
  min_vel_x: 0.0
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 1.20
  min_vel_trans: 0.05
  max_vel_theta: 0.7805
  min_vel_theta: 0.0
  acc_lim_x: 0.60
  acc_lim_y: 0.0
  acc_lim_theta: 0.75
  xy_goal_tolerance: 0.25
  yaw_goal_tolerance: 0.20
  latch_xy_goal_tolerance: true
  sim_time: 3.0
  sim_granularity: 0.05
  angular_sim_granularity: 0.025
  vx_samples: 24
  vy_samples: 1
  vth_samples: 48
  path_distance_bias: 20.0
  goal_distance_bias: 14.0
  occdist_scale: 1.00
  forward_point_distance: 0.50
  stop_time_buffer: 1.00
  scaling_speed: 0.40
  max_scaling_factor: 0.60
  oscillation_reset_dist: 0.20
  prune_plan: true
